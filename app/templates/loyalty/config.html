{% extends "base.html" %}
{% block title %}Loyalty Config — {{ config.HOTEL_NAME }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-gear me-2"></i>Loyalty Configuration</h5>
    <a href="{{ url_for('loyalty.dashboard') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>

<form method="POST">
<div class="row g-3">
{% for t in tiers %}
<div class="col-md-4">
    <div class="card border-0 shadow-sm">
        <div class="card-header d-flex align-items-center gap-2" style="background:{{ t.color_hex }}15;">
            <span class="badge fs-6" style="background:{{ t.color_hex }}">{{ t.tier_name }}</span>
            <span class="small text-muted">Order: {{ t.tier_order }}</span>
        </div>
        <div class="card-body">
            <div class="mb-2">
                <label class="form-label small fw-semibold">Min Points to Enter</label>
                <input type="number" class="form-control form-control-sm" name="t{{ t.id }}_min_points" value="{{ t.min_points }}" min="0">
            </div>
            <hr class="my-2">
            <div class="small fw-bold text-muted mb-2">EARNING</div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small">Pts / Night</label>
                    <input type="number" class="form-control form-control-sm" name="t{{ t.id }}_earn_per_night" value="{{ t.earn_per_night }}" min="0">
                </div>
                <div class="col-6">
                    <label class="form-label small">Pts / ₹100</label>
                    <input type="number" class="form-control form-control-sm" name="t{{ t.id }}_earn_per_100_rupees" value="{{ t.earn_per_100_rupees }}" min="0">
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label small">Direct Booking Bonus %</label>
                <input type="number" class="form-control form-control-sm" name="t{{ t.id }}_direct_bonus" value="{{ t.direct_booking_bonus_pct }}" min="0" max="100">
            </div>
            <hr class="my-2">
            <div class="small fw-bold text-muted mb-2">REDEMPTION</div>
            <div class="mb-2">
                <label class="form-label small">₹ Value per Point</label>
                <input type="number" step="0.01" class="form-control form-control-sm" name="t{{ t.id }}_redemption_value" value="{{ t.redemption_value }}" min="0">
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small">Late CO Cost</label>
                    <input type="number" class="form-control form-control-sm" name="t{{ t.id }}_late_co" value="{{ t.late_checkout_points }}" min="0">
                </div>
                <div class="col-6">
                    <label class="form-label small">Early CI Cost</label>
                    <input type="number" class="form-control form-control-sm" name="t{{ t.id }}_early_ci" value="{{ t.early_checkin_points }}" min="0">
                </div>
            </div>
            <div class="mb-0">
                <label class="form-label small">Badge Color</label>
                <input type="color" class="form-control form-control-sm form-control-color" name="t{{ t.id }}_color" value="{{ t.color_hex }}" style="width:60px;height:30px;">
            </div>
        </div>
    </div>
</div>
{% endfor %}
</div>

<div class="mt-3">
    <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Save Configuration</button>
</div>
</form>
{% endblock %}
