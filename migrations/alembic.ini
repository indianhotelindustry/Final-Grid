# A generic, single database configuration.
#
# v2.2.13 hardening (Phase 1 of deployment governance overhaul):
# script_location and sqlalchemy.url are now declared explicitly so the
# alembic CLI can be invoked WITHOUT Flask context. This is the operator
# recovery path: any operator can run `alembic -c migrations/alembic.ini
# upgrade head` from a production shell to advance migrations, and
# `... current` / `... history` for diagnostics — no Flask app boot
# required.
#
# Note: env.py is dual-mode (Flask-aware AND standalone-capable). When
# invoked via `flask db ...`, the Flask path takes precedence and
# overrides sqlalchemy.url from current_app.extensions['migrate'].
# When invoked via raw `alembic ...`, env.py reads sqlalchemy.url from
# this file and imports the model metadata directly from app.models.

[alembic]
# Where the migration scripts live, relative to this .ini's directory.
# Alembic resolves %(here)s to the directory containing this file.
script_location = %(here)s

# Default DB URL for standalone CLI use. Resolves to instance/pms.db
# relative to the app root (parent of migrations/). The Flask path
# overrides this at runtime, so production deployments using
# DATABASE_URL or non-default paths are unaffected.
sqlalchemy.url = sqlite:///%(here)s/../instance/pms.db

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
