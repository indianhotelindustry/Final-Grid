{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 text-center">
        <div class="display-1 fw-bold text-warning">403</div>
        <h4 class="mb-3">Access Denied</h4>
        <p class="text-muted">You don't have permission to access this page. Contact your administrator if you think this is a mistake.</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
